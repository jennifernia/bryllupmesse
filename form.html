<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular | Layali bryllupsmesse</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">Layali tilmeldingsformular</a>
      <nav class="site-nav">
        <button>Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Interaktiv SVG</a></li>
          <li><a href="./form.html" aria-current="page">Formular</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <main>
      <section class="form-page">

        <header class="form-intro">
          <p class="undertitel">
            THE MULTICULTURAL WEDDING EXPERIENCE
          </p>

          <h1>Tilmeld dig bryllupsmessen</h1>

          <p class="beskrivelse">
            Sikre din plads til LAYALI - en unik
            bryllupsmesse, hvor kærlighed,
            traditioner og moderne trends mødes.
          </p>
        </header>

        <div class="billede-baggrund">

          <form class="form-placeholder" id="tilmelding" action="./opsamling.html">

            <h2>Tilmeldingsformular</h2>

            <label for="navn">Fulde navn *</label>
            <input type="text" id="navn" name="navn" required>

            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" required>

            <label for="telefon">Telefonnummer *</label>
            <input type="tel" id="telefon" name="telefon" required>

            <label for="antal">Antal deltagere *</label>
            <select id="antal" name="antal" required>
              <option value="">Vælg antal</option>
              <option value="1">1 deltager</option>
              <option value="2">2 deltagere</option>
              <option value="3">3 deltagere</option>
              <option value="4">4 deltagere</option>
              <option value="5">5 deltagere</option>
            </select>

            <div class="betingelser">
              <input type="checkbox" id="vilkaar" required>
              <label for="vilkaar">
                Jeg accepterer vilkår og betingelser
                for tilmelding *
              </label>
            </div>

            <button type="submit">
              Tilmeld mig messen <span>⟶</span>
            </button>

          </form>
        </div>

      </section>
    </main>

  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>Layali</p>
      <p>Footer</p </div>
  </footer>
  <script src="./script.js">
    document.getElementById("tilmelding")
      .addEventListener("submit", function (event) {
        event.preventDefault();
        alert("Formularen er udfyldt!");
      });
  </script>
</body>

</html>
